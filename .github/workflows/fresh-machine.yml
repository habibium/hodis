# Proves the embedded-engine bootstrap, which a search naming SearXNG starts
# when no instance answers, on machines hodis's end users actually have: no
# curl, python, pip or uv on PATH. The build step uses the full
# runner toolchain; the smoke step then strips PATH down to the OS's own
# binaries, so the only external tools hodis can reach are the ones every
# stock install ships (notably tar).
#
# Manual trigger only: each run downloads a few hundred megabytes and boots a
# real SearXNG, which is too heavy for per-push CI. Note that upstream search
# engines often reject datacenter IPs, so the smoke asserts a clean exit and a
# self-owned toolchain rather than non-empty results.
name: fresh-machine

on: workflow_dispatch

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked

      - name: Bootstrap and search on a bare PATH (unix)
        if: runner.os != 'Windows'
        env:
          HODIS_DATA_DIR: ${{ runner.temp }}/hodis-data
        run: |
          env PATH=/usr/bin:/bin ./target/release/hodis --provider searxng "rust programming language"
          echo "--- data dir ---"
          find "$HODIS_DATA_DIR" -maxdepth 3 | head -30
          test -x "$HODIS_DATA_DIR/bin/uv"
          test -x "$HODIS_DATA_DIR/engine/venv/bin/python"

      - name: Bootstrap and search on a bare PATH (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HODIS_DATA_DIR: ${{ runner.temp }}\hodis-data
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & .\target\release\hodis.exe --provider searxng "rust programming language"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "--- data dir ---"
          Get-ChildItem -Recurse -Depth 2 $env:HODIS_DATA_DIR | Select-Object -First 30
          if (-not (Test-Path "$env:HODIS_DATA_DIR\bin\uv.exe")) { throw "uv missing" }
          if (-not (Test-Path "$env:HODIS_DATA_DIR\engine\venv\Scripts\python.exe")) { throw "venv python missing" }

      - name: Engine log on failure (unix)
        if: failure() && runner.os != 'Windows'
        run: cat "${{ runner.temp }}/hodis-data/engine/searxng.log" || true

      - name: Engine log on failure (windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\hodis-data\engine\searxng.log" -ErrorAction SilentlyContinue

      - name: Second run reuses the running instance (unix)
        if: runner.os != 'Windows'
        env:
          HODIS_DATA_DIR: ${{ runner.temp }}/hodis-data
        run: |
          start=$(date +%s)
          env PATH=/usr/bin:/bin ./target/release/hodis --provider searxng "cargo build"
          echo "reuse took $(( $(date +%s) - start ))s"

      - name: Second run reuses the running instance (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HODIS_DATA_DIR: ${{ runner.temp }}\hodis-data
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & .\target\release\hodis.exe --provider searxng "cargo build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "reuse took $($sw.Elapsed.TotalSeconds)s"

  # CI's own account is an administrator, which hides what a standard Windows
  # account is refused, such as creating a symlink. A task scheduled to run as
  # such an account gets a real profile and the default data directory.
  windows-standard-user:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked

      - name: Bootstrap and search as a standard user
        shell: pwsh
        run: |
          $dir = 'C:\Users\Public\hodis-smoke'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\hodis.exe $dir
          icacls $dir /grant 'Everyone:(OI)(CI)M' | Out-Null
          @(
            '@echo off'
            "whoami /priv > $dir\privileges.txt"
            "$dir\hodis.exe --provider searxng ""rust programming language"" > $dir\out.txt 2> $dir\err.txt"
            "echo %ERRORLEVEL%> $dir\exit.txt"
          ) | Set-Content -Encoding ascii "$dir\run.cmd"

          $name = 'hodis-smoke'
          $password = "Aa1!$([guid]::NewGuid())"
          New-LocalUser -Name $name -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c $dir\run.cmd"
          Register-ScheduledTask -TaskName $name -Action $action -User $name -Password $password -RunLevel Limited | Out-Null
          Start-ScheduledTask -TaskName $name

          $deadline = (Get-Date).AddMinutes(20)
          while (-not (Test-Path "$dir\exit.txt") -and (Get-Date) -lt $deadline) { Start-Sleep 5 }

          Get-Content "$dir\privileges.txt" -ErrorAction SilentlyContinue
          Write-Host '--- stderr'
          Get-Content "$dir\err.txt" -ErrorAction SilentlyContinue
          Write-Host '--- stdout'
          Get-Content "$dir\out.txt" -ErrorAction SilentlyContinue | Select-Object -First 20
          Write-Host '--- engine log'
          Get-Content "C:\Users\$name\AppData\Roaming\hodis\engine\searxng.log" -Tail 40 -ErrorAction SilentlyContinue
          $code = Get-Content "$dir\exit.txt" -ErrorAction SilentlyContinue
          Write-Host "exit code: $code"
          if ($code -ne '0') { exit 1 }
