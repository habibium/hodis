name: tmp-windows-probe

on:
  push:
    branches: [feat/setup-wizard]
    paths: [.github/workflows/tmp-windows-probe.yml]

permissions:
  contents: read

jobs:
  console:
    name: console2 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Run the published hodis in a real console
        shell: pwsh
        run: |
          python --version
          python -m pip install --quiet pywinpty
          $dir = "$env:RUNNER_TEMP\hodis-console"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/habibium/hodis/releases/download/v0.1.0/hodis-x86_64-pc-windows-msvc.zip' -OutFile "$dir\hodis.zip"
          Expand-Archive "$dir\hodis.zip" $dir
          $exe = "$dir\hodis-x86_64-pc-windows-msvc\hodis.exe"
          @'
          import os, re, sys, threading, time
          from winpty import PtyProcess

          exe, data = sys.argv[1:3]
          env = dict(os.environ, HODIS_DATA_DIR=data)
          began = time.time()
          p = PtyProcess.spawn([exe, "--provider", "searxng", "rust programming language"], dimensions=(30, 120), env=env)
          seen = []

          def pump():
              while True:
                  try:
                      seen.append(p.read(4096))
                  except EOFError:
                      return

          threading.Thread(target=pump, daemon=True).start()
          while p.isalive() and time.time() - began < 300:
              time.sleep(1)
          time.sleep(2)
          alive = p.isalive()
          text = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]|\x1b\][^\x07]*\x07", "", "".join(seen))
          lines = [l.rstrip() for l in text.splitlines() if l.strip() and not l.strip().startswith("+ ")]
          print("\n".join(l[:170] for l in lines[:30]))
          print("...")
          print("\n".join(l[:170] for l in lines[-8:]))
          print(f"seconds: {time.time() - began:.0f}  alive: {alive}  exit: {p.exitstatus}")
          if alive:
              p.terminate(force=True)
          os._exit(0)
          '@ | Set-Content -Encoding utf8 "$dir\drive.py"
          python "$dir\drive.py" $exe "$dir\data"
          Write-Host '--- engine log'
          Get-Content "$dir\data\engine\searxng.log" -Tail 8 -ErrorAction SilentlyContinue
