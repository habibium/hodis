name: tmp-windows-probe

on:
  push:
    branches: [feat/setup-wizard]
    paths: [.github/workflows/tmp-windows-probe.yml]

permissions:
  contents: read

jobs:
  console:
    name: console ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Run the published hodis in a real console
        shell: pwsh
        run: |
          python --version
          python -m pip install --quiet pywinpty
          $dir = "$env:RUNNER_TEMP\hodis-console"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/habibium/hodis/releases/download/v0.1.0/hodis-x86_64-pc-windows-msvc.zip' -OutFile "$dir\hodis.zip"
          Expand-Archive "$dir\hodis.zip" $dir
          $exe = "$dir\hodis-x86_64-pc-windows-msvc\hodis.exe"
          @'
          import os, re, sys, time
          from winpty import PtyProcess

          exe, data, mode = sys.argv[1:4]
          env = dict(os.environ, HODIS_DATA_DIR=data)
          args = [exe, "--provider", "searxng"] + (["rust programming language"] if mode == "query" else [])
          p = PtyProcess.spawn(args, dimensions=(30, 120), env=env)
          seen, deadline, sent = "", time.time() + 480, False
          while p.isalive() and time.time() < deadline:
              try:
                  chunk = p.read(4096)
              except EOFError:
                  break
              seen += chunk
              if mode == "tui" and not sent and "search" in chunk.lower() and "setup:" not in chunk:
                  time.sleep(2); p.write("q"); sent = True
          text = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]|\x1b\][^\x07]*\x07", "", seen)
          lines = [l.rstrip() for l in text.splitlines() if l.strip() and not l.strip().startswith("+ ")]
          print("\n".join(l[:160] for l in lines[:45]))
          print("...")
          print("\n".join(l[:160] for l in lines[-12:]))
          print("alive:", p.isalive(), "exit:", p.exitstatus)
          '@ | Set-Content -Encoding utf8 "$dir\drive.py"
          foreach ($mode in 'query', 'tui') {
            Write-Host "=== console $mode"
            python "$dir\drive.py" $exe "$dir\data-$mode" $mode
          }

  own-python:
    name: own python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Run the published hodis next to a python3.13 uv does not manage
        shell: pwsh
        env:
          HODIS_DATA_DIR: ${{ runner.temp }}\hodis-own
        run: |
          $dir = "$env:RUNNER_TEMP\hodis-bin"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/habibium/hodis/releases/download/v0.1.0/hodis-x86_64-pc-windows-msvc.zip' -OutFile "$dir\hodis.zip"
          Expand-Archive "$dir\hodis.zip" $dir
          $bin = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Set-Content "$bin\python3.13.exe" 'not uv'
          & "$dir\hodis-x86_64-pc-windows-msvc\hodis.exe" --provider searxng "rust programming language" 2>&1 | Where-Object { "$_" -notmatch '^ \+ ' } | Select-Object -First 25
          Write-Host "exit: $LASTEXITCODE"
