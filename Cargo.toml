[package]
name = "hodis"
version = "0.0.0"
edition = "2024"
description = "Websearch tool for humans and AI"
repository = "https://github.com/habibium/hodis"
license = "MIT"
keywords = ["cli", "search", "web"]
categories = ["command-line-utilities"]

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
getrandom = "0.4"
keyring-core = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
rmcp = { version = "3", features = ["server", "transport-io"] }
rpassword = "7"
schemars = { version = "1", features = ["url2"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
url = { version = "2", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# No runtime feature: zbus then runs its own executor, so keyring's blocking
# calls also work from inside the tokio runtime hodis runs on.
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
insta = "1"
jsonschema = { version = "0.60", default-features = false }
keyring-core = { version = "1", features = ["sample"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
rmcp = { version = "3", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
wiremock = "0.6.5"

[lints.clippy]
missing_errors_doc = "allow"
pedantic = { level = "deny", priority = -1 }

[lints.rust]
missing_debug_implementations = "warn"
