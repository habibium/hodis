[package]
name = "hodis"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Websearch tool for humans and AI"
repository = "https://github.com/habibium/hodis"
license = "MIT"
keywords = ["cli", "search", "web"]
categories = ["command-line-utilities"]
exclude = [".github/", "scripts/", "bacon.toml"]

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
etcetera = "0.11"
flate2 = "1.1.10"
futures = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
keyring-core = "1"
open = "5"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.13", features = ["form", "json", "query"] }
rmcp = { version = "3", features = ["server", "transport-io"] }
rpassword = "7"
schemars = { version = "1", features = ["url2"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = "0.25.18"
unicode-segmentation = "1"
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# No runtime feature: zbus then runs its own executor, so keyring's blocking
# calls also work from inside the tokio runtime hodis runs on.
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
insta = "1"
jsonschema = { version = "0.60", default-features = false }
keyring-core = { version = "1", features = ["sample"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
rmcp = { version = "3", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
wiremock = "0.6.5"

[lints.clippy]
missing_errors_doc = "allow"
pedantic = { level = "deny", priority = -1 }

[lints.rust]
missing_debug_implementations = "warn"
