[package]
name = "hodis"
version = "0.0.0"
edition = "2024"
description = "Websearch tool for humans and AI"
repository = "https://github.com/habibium/hodis"
license = "MIT"
keywords = ["cli", "search", "web"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
url = { version = "2", features = ["serde"] }
